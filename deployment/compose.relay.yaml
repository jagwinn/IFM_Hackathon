services:
  open-webui:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.relay
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}"
      RELAY_PROVIDER: simulated
      CLOUD_ENABLED: "true"
      ENABLE_PLUGINS: "true"
    volumes:
      - relay-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  relay-webui-data:
