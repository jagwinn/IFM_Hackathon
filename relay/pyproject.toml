[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-relay"
version = "0.1.0"
description = "Bounded planner-worker orchestration for Open WebUI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
horizon-relay = "horizon_relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horizon_relay = ["fixtures/*.json"]
