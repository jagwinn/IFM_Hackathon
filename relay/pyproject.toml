[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-relay"
version = "0.3.0"
description = "Local-first relay: a small local model answers and works subtasks; a large cloud model plans and checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["httpx>=0.28,<1"]

[project.scripts]
horizon-relay = "horizon_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
horizon_relay = ["fixtures/*.json", "ui/*.html"]
